schema_version: "1.1"
name: none-branch-protection
description: "Routing: a near miss (forge settings, not a merge decision) must load none of merge-gates, change-flow."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write the gh api command that creates a GitHub ruleset on main requiring one approving review and the status check "ci / test". I only need the JSON payload and the command.
graders:
  - name: does-not-load-merge-gates
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?merge-gates"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-change-flow
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?change-flow"'
    min: 0
    max: 0
    arm: both
