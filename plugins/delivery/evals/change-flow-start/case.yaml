schema_version: "1.1"
name: change-flow-start
description: "Routing: must load change-flow and none of delivery-models."
tags: [routing, change-flow]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    I need to add a --json output flag to our command-line tool in this repository. Plan the change, set up the branch and get a draft pull request going the right way.
graders:
  - name: loads-change-flow
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?change-flow"'
  - name: does-not-load-delivery-models
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?delivery-models"'
    min: 0
    max: 0
    arm: both
