schema_version: "1.1"
name: none-regex-question
description: "Routing: a question outside the plugin must load none of change-flow, merge-gates, delivery-models."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    What does the regular expression ^\d{3}-\d{4}$ match? Give two examples that match and one that does not.
graders:
  - name: does-not-load-change-flow
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?change-flow"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-merge-gates
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?merge-gates"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-delivery-models
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?delivery-models"'
    min: 0
    max: 0
    arm: both
