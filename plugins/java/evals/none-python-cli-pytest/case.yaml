schema_version: "1.1"
name: none-python-cli-pytest
description: "Routing: a request for a Python CLI with pytest (a sibling technology) must not load java."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Add a --dry-run flag to our Python CLI (src/sync/cli.py, built with argparse) and a pytest test for it; the project uses uv and pyproject.toml.
graders:
  - name: does-not-load-java
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?java"'
    min: 0
    max: 0
    arm: both
