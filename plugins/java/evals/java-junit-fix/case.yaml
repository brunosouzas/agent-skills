schema_version: "1.1"
name: java-junit-fix
description: "Routing: must load java."
tags: [routing, java]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    This Spring Boot service's OrderService.findByCustomer returns null when there are no orders. Change it to return an empty list and add a JUnit 5 test; the build is Maven with ./mvnw.
graders:
  - name: loads-java
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?java"'
