schema_version: "1.1"
name: jenkins-credentials
description: "Routing: must load jenkins and none of github-actions, azure-devops."
tags: [routing, jenkins]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In our Jenkinsfile the deploy stage does sh "curl -H 'Authorization: $TOKEN' ..." inside withCredentials. Jenkins warns about it; fix the pipeline.
graders:
  - name: loads-jenkins
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jenkins"'
  - name: does-not-load-github-actions
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-actions"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-azure-devops
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?azure-devops"'
    min: 0
    max: 0
    arm: both
