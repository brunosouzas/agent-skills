schema_version: "1.1"
name: github-actions-pr-title
description: "Routing: must load github-actions and none of azure-devops, jenkins."
tags: [routing, github-actions]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a GitHub Actions workflow in .github/workflows/pr-title.yml that fails a pull request whose title is not a Conventional Commit. Keep the token read-only.
graders:
  - name: loads-github-actions
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-actions"'
  - name: does-not-load-azure-devops
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?azure-devops"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-jenkins
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jenkins"'
    min: 0
    max: 0
    arm: both
