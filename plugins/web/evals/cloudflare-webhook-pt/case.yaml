schema_version: "1.1"
name: cloudflare-webhook-pt
description: "Routing: must load cloudflare and none of astro."
tags: [routing, cloudflare]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    No nosso Cloudflare Worker (wrangler.toml), quero uma rota POST /github que verifique a assinatura sha256= do webhook do GitHub antes de processar. Como faço?
graders:
  - name: loads-cloudflare
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cloudflare"'
  - name: does-not-load-astro
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?astro"'
    min: 0
    max: 0
    arm: both
