schema_version: "1.1"
name: none-nextjs-vercel
description: "Routing: a request outside the plugin must load none of astro, cloudflare."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our Next.js 15 app on Vercel needs a new app-router page /pricing with server components that read from Postgres via Prisma.
graders:
  - name: does-not-load-astro
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?astro"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-cloudflare
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cloudflare"'
    min: 0
    max: 0
    arm: both
