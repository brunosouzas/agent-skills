schema_version: "1.1"
name: none-java-junit-fix
description: "Routing: a request for a Java JUnit fix (a sibling technology) must not load shell."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    This Spring Boot service's OrderService.findByCustomer returns null when there are no orders. Change it to return an empty list and add a JUnit 5 test; the build is Maven with ./mvnw.
graders:
  - name: does-not-load-shell
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shell"'
    min: 0
    max: 0
    arm: both
