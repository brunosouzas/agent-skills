schema_version: "1.1"
name: none-jenkinsfile
description: "Routing: a request outside the plugin must not load github-actions."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our Jenkinsfile has a parallel stage that retries a flaky integration test three times. Make the retry only apply to that stage.
graders:
  - name: does-not-load-github-actions
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-actions"'
    min: 0
    max: 0
    arm: both
