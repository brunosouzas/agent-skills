schema_version: "1.1"
name: none-azure-pipelines-template
description: "Routing: a request for an Azure Pipelines template (a sibling technology) must not load github-actions."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our azure-pipelines.yml pulls templates from another repository with ref: refs/heads/main. Pin it properly and make the production stage run only from release tags.
graders:
  - name: does-not-load-github-actions
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?github-actions"'
    min: 0
    max: 0
    arm: both
