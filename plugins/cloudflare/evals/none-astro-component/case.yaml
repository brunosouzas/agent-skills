schema_version: "1.1"
name: none-astro-component
description: "Routing: a request outside the plugin must not load cloudflare."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    On our Astro site, add a Card.astro component that takes a title and an image and styles it with scoped CSS.
graders:
  - name: does-not-load-cloudflare
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cloudflare"'
    min: 0
    max: 0
    arm: both
