schema_version: "1.1"
name: none-github-workflow
description: "Routing: a request outside the plugin must not load jenkins."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a GitHub Actions workflow in .github/workflows/lint.yml that runs eslint on every pull request.
graders:
  - name: does-not-load-jenkins
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jenkins"'
    min: 0
    max: 0
    arm: both
