schema_version: "1.1"
name: jenkins-credentials
description: "Routing: must load jenkins."
tags: [routing, jenkins]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In our Jenkinsfile the deploy stage does sh "curl -H 'Authorization: $TOKEN' ..." inside withCredentials. Jenkins warns about it; fix the pipeline.
graders:
  - name: loads-jenkins
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?jenkins"'
