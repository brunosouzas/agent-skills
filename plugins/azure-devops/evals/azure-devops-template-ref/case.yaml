schema_version: "1.1"
name: azure-devops-template-ref
description: "Routing: must load azure-devops."
tags: [routing, azure-devops]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our azure-pipelines.yml pulls templates from another repository with ref: refs/heads/main. Pin it properly and make the production stage run only from release tags.
graders:
  - name: loads-azure-devops
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?azure-devops"'
