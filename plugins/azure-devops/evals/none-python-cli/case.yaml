schema_version: "1.1"
name: none-python-cli
description: "Routing: a request outside the plugin must not load azure-devops."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Refactor this Python function that parses a CSV of invoices into dataclasses, and add type hints.
graders:
  - name: does-not-load-azure-devops
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?azure-devops"'
    min: 0
    max: 0
    arm: both
