schema_version: "1.1"
name: none-github-actions-workflow
description: "Routing: a request for a GitHub Actions workflow (a sibling technology) must not load azure-devops."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write a GitHub Actions workflow in .github/workflows/pr-title.yml that fails a pull request whose title is not a Conventional Commit. Keep the token read-only.
graders:
  - name: does-not-load-azure-devops
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?azure-devops"'
    min: 0
    max: 0
    arm: both
