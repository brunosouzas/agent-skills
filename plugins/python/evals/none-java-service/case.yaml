schema_version: "1.1"
name: none-java-service
description: "Routing: a request outside the plugin must not load python."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Our Java service uses Maven and the build fails because two JUnit versions end up on the test classpath. How do I pin one?
graders:
  - name: does-not-load-python
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?python"'
    min: 0
    max: 0
    arm: both
