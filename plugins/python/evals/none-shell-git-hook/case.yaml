schema_version: "1.1"
name: none-shell-git-hook
description: "Routing: a request for a shell git hook (a sibling technology) must not load python."
tags: [routing, negative]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Escreve um pre-commit hook em bash que rode shellcheck só nos arquivos .sh que mudaram no commit e falhe se algum tiver erro. Tem que funcionar também no bash 3.2.
graders:
  - name: does-not-load-python
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?python"'
    min: 0
    max: 0
    arm: both
