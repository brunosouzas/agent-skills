schema_version: "1.1"
name: mulesoft-duplicate-charge
description: "Routing: a Mule flow problem with no pattern named must load mulesoft and none of dataweave, munit, mule-sdk."
tags: [routing, mulesoft, eip]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Monto um flow Mule 4 que recebe o pedido e cobra o cartão. Quando o cliente reenvia o mesmo pedido porque a rede caiu, o cartão é cobrado de novo. Como ajusto o flow?
graders:
  - name: loads-mulesoft
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mulesoft"'
  - name: does-not-load-dataweave
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dataweave"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-munit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?munit"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-mule-sdk
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mule-sdk"'
    min: 0
    max: 0
    arm: both
