schema_version: "1.1"
name: dataweave-adjust-function
description: "Routing: must load dataweave and none of mulesoft, munit, mule-sdk."
tags: [routing, dataweave]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Ajusta essa função DataWeave para devolver null, e não string vazia, quando customerName não vier:

    %dw 2.0
    output application/json
    fun formatName(c) = upper(c.customerName default "")
    ---
    formatName(payload)
graders:
  - name: loads-dataweave
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dataweave"'
  - name: does-not-load-mulesoft
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mulesoft"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-munit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?munit"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-mule-sdk
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mule-sdk"'
    min: 0
    max: 0
    arm: both
