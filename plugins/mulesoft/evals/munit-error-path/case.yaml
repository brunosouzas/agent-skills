schema_version: "1.1"
name: munit-error-path
description: "Routing: must load munit and none of dataweave, mule-sdk."
tags: [routing, munit]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Write an MUnit test for the sub-flow sf-get-customer that checks the 404 path: the HTTP request 'Query CRM Customer' should fail with HTTP:NOT_FOUND and the flow should return status 404.
graders:
  - name: loads-munit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?munit"'
  - name: does-not-load-dataweave
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dataweave"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-mule-sdk
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mule-sdk"'
    min: 0
    max: 0
    arm: both
