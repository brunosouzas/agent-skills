schema_version: "1.1"
name: mulesoft-queue-failure
description: "Routing: a Mule flow problem with no pattern named must load mulesoft and none of dataweave, munit, mule-sdk."
tags: [routing, mulesoft, eip]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Tenho um consumidor de uma fila Anypoint MQ. Quando o processamento de uma mensagem falha dez vezes, a mensagem fica voltando para a fila para sempre. O que devo configurar?
graders:
  - name: loads-mulesoft
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mulesoft"'
  - name: does-not-load-dataweave
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dataweave"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-munit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?munit"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-mule-sdk
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mule-sdk"'
    min: 0
    max: 0
    arm: both
