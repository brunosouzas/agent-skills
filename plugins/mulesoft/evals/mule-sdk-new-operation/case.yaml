schema_version: "1.1"
name: mule-sdk-new-operation
description: "Routing: must load mule-sdk and none of dataweave, munit."
tags: [routing, mule-sdk]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Vou mudar a assinatura da operação getAccount do nosso conector Mule SDK (classe @Operations, packaging mule-extension): o parâmetro accountId vira um objeto. Que versão devo publicar e o que preciso cuidar na conexão?
graders:
  - name: loads-mule-sdk
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mule-sdk"'
  - name: does-not-load-dataweave
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dataweave"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-munit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?munit"'
    min: 0
    max: 0
    arm: both
