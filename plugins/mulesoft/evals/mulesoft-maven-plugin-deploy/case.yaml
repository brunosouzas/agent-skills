schema_version: "1.1"
name: mulesoft-maven-plugin-deploy
description: "Routing: the Mule Maven Plugin's deployment config of an application must load mulesoft, not mule-sdk."
tags: [routing, mulesoft]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    My Mule 4 application reads ${crm.clientId} but on CloudHub 2.0 the value is empty. The pom.xml has the mule-maven-plugin with a cloudhub2Deployment block. What am I missing?
graders:
  - name: loads-mulesoft
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mulesoft"'
  - name: does-not-load-mule-sdk
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mule-sdk"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-dataweave
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dataweave"'
    min: 0
    max: 0
    arm: both
