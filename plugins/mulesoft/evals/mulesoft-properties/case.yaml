schema_version: "1.1"
name: mulesoft-properties
description: "Routing: must load mulesoft and none of dataweave, munit, mule-sdk."
tags: [routing, mulesoft]
runs: 3
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    In my Mule 4 application, where should the CRM host, port and client secret go so the same jar runs in test and prod on CloudHub 2.0?
graders:
  - name: loads-mulesoft
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mulesoft"'
  - name: does-not-load-dataweave
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?dataweave"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-munit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?munit"'
    min: 0
    max: 0
    arm: both
  - name: does-not-load-mule-sdk
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mule-sdk"'
    min: 0
    max: 0
    arm: both
